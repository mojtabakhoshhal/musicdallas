name: Build Dallas Music Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Release APK (Free Ubuntu Runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify bundled catalog.json exists
        run: |
          test -s app/src/main/assets/catalog.json
          python3 -c 'import json; data=json.load(open("app/src/main/assets/catalog.json")); print("Catalog tracks:", len(data)); assert len(data) >= 100'

      - name: Run unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Create release keystore
        # No upload keystore is stored in the repo (public repo must never hold a private key).
        # Generate a throwaway self-signed keystore so the release APK can be built and
        # sideloaded for testing. NOTE: a fresh key each run means app updates need
        # uninstall + reinstall; for a stable signing key, add the real keystore as a
        # GitHub Secret instead.
        run: |
          keytool -genkeypair -v -keystore my-upload-key.jks -alias dallas -keyalg RSA -keysize 2048 -validity 10000 -storepass dallas2026 -keypass dallas2026 -dname "CN=Dallas Music, O=Dallas, C=IR"

      - name: Build unsigned/debug release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dallas-music-android-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
