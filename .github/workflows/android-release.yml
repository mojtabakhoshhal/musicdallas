name: Build Dallas Music Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Release APK (Free Ubuntu Runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify bundled catalog.json exists
        run: |
          test -s app/src/main/assets/catalog.json
          python3 -c 'import json; data=json.load(open("app/src/main/assets/catalog.json")); print("Catalog tracks:", len(data)); assert len(data) >= 100'

      - name: Run unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build unsigned/debug release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dallas-music-android-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
